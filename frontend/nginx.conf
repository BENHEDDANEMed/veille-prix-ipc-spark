server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/... est transmis à FastAPI (service "api" de docker compose) : une seule adresse pour le navigateur
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_read_timeout 120s;   # premier appel lent : Spark charge les tables
    }

    location / {
        try_files $uri /index.html;
    }
}
